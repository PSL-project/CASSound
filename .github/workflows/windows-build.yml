name: Windows application and installer
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --extra full --extra dev
      - run: choco install ffmpeg innosetup --yes --no-progress
      - name: Build native host and fixture
        run: uv run --no-sync python tools/build_native.py --fetch
      - run: uv run --no-sync python tools/native_test_environment.py build/native
      - run: uv run --no-sync python -m pytest -q --junitxml=artifacts/test-results.xml
      - run: uv run --no-sync python tools/fetch_models.py model-packs
      - run: uv run --no-sync python tools/model_smoke.py model-packs
      - run: uv run --no-sync python tools/build_release.py --target python
      - run: uv run --no-sync python tools/build_release.py --target desktop --require-windows
      - run: uv run --no-sync python tools/build_release.py --target installer --require-windows
      - uses: actions/upload-artifact@v4
        with:
          name: CASSound-windows-x64
          path: dist/
          # sklearn loads DLLs from _internal/sklearn/.libs by absolute path.
          # upload-artifact excludes dot-directories unless explicitly enabled.
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CASSound-model-packs
          path: model-packs/*.casp
      - uses: actions/upload-artifact@v4
        with:
          name: CASSound-testfx
          path: build/native/fixture_bundle/
      - name: Preserve build diagnostics and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          if-no-files-found: warn
          path: |
            build/native/logs/
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
            artifacts/
  verify:
    timeout-minutes: 30
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: CASSound-windows-x64
          path: packaged/
      - uses: actions/download-artifact@v4
        with:
          name: CASSound-testfx
          path: fixture/
      - uses: actions/download-artifact@v4
        with:
          name: CASSound-model-packs
          path: model-packs/
      - name: Check downloaded runtime DLLs
        shell: pwsh
        run: |
          foreach ($dll in @('vcomp140.dll', 'msvcp140.dll')) {
            $runtime = Join-Path 'packaged/CASSound/_internal/sklearn/.libs' $dll
            if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) {
              throw "Downloaded application artifact is missing runtime: $runtime"
            }
          }
      - name: Verify scientific-and-native
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/verify_frozen.py packaged/CASSound/CASSoundCLI.exe --features --p3 --vst3 fixture/cassound-testfx.vst3 2>&1 | Tee-Object -FilePath artifacts/scientific-and-native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify reports-and-models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python tools/verify_release_runtime.py packaged/CASSound/CASSoundCLI.exe --models model-packs 2>&1 | Tee-Object -FilePath artifacts/reports-and-models.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify gui-startup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          packaged/CASSound/CASSound.exe --gui-startup-check 2>&1 | Tee-Object -FilePath artifacts/gui-startup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve packaged verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-verification
          if-no-files-found: warn
          path: artifacts/

