name: Core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.4
      - run: uv sync --frozen --extra full --extra dev
      - run: uv run --no-sync ruff check src tests tools benchmarks
      - name: Build native host and compatibility fixtures
        run: uv run --no-sync python tools/build_native.py --fetch --mda
      - run: uv run --no-sync python tools/native_test_environment.py build/native
      - run: uv run --no-sync python -m pytest -q --junitxml=artifacts/test-results.xml
      - run: uv run --no-sync python -m build
      - run: uv run --no-sync python tools/gui_release_smoke.py --output artifacts/workbench.png
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Preserve native diagnostics and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-diagnostics-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            build/native/logs/
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
            artifacts/
